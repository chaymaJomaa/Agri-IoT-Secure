
# mosquitto.conf — Étape 3 : Broker de développement (local uniquement)
# Écoute seulement sur la machine locale : personne d'autre sur le réseau ne peut s'y connecter
listener 1883 127.0.0.1   # se connecter au broker à l'adresse 127.0.0.1:1883.
allow_anonymous true # clients MQTT se connectent sans fournir login & pwd
# Journalisation détaillée dans la console
log_type all
connection_messages true


cafile D:\TP_IoT\agri-iot\broker\tls\ca.crt
certfile D:\TP_IoT\agri-iot\broker\tls\server.crt
keyfile D:\TP_IoT\agri-iot\broker\tls\server.key
